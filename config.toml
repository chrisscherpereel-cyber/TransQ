[server]
# Streamlit Community Cloud caps at ~1 GB of RAM; keep uploads modest.
maxUploadSize = 400
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#00539B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#1B1F23"
font = "sans serif"
